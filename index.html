<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Puzzle Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Museum Puzzle Quest</h1>
        
        <div id="audio-section">
            <h3 id="station-title">Scan a QR code to begin!</h3>
            <audio id="station-audio" controls></audio>
            
            <!-- Private Browser Workaround Area -->
            <div id="private-browser-warning" style="margin-top: 15px; display: none;">
                <p style="color: #d9534f; font-size: 14px; margin: 5px 0;">⚠️ Using Private Mode? Use this link to walk to the next station so you don't lose your pieces:</p>
                <a id="next-station-link" href="#" style="background: #0275d8; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px; display: inline-block; font-weight: bold; margin-top: 5px;">Go to Next Station & Save Progress</a>
            </div>
        </div>

        <div class="puzzle-container">
            <div class="puzzle-grid" id="puzzle-board">
                <!-- 6 pieces will load dynamically -->
            </div>
        </div>

        <!-- Reset Button -->
        <button id="reset-btn" style="margin-top: 30px; background-color: #bbbbbb; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 14px;">Reset Puzzle Progress</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
