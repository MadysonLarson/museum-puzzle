<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Puzzle Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Museum Puzzle Quest</h1>
        
        <div id="audio-section">
            <h3 id="station-title">Scan a QR code to begin!</h3>
            <audio id="station-audio" controls></audio>
        </div>

        <div class="puzzle-container">
            <div class="puzzle-grid" id="puzzle-board">
                <!-- 6 pieces will load dynamically -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
